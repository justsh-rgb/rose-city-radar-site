<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Holds · Rose City Radar</title>
<style>
  :root { --bg: #0b100e; --panel: #111915; --line: rgba(243,240,233,.12); --ink: #f3f0e9; --ink-2: #a9b6af; --ink-3: #7d8c83; --rose: #e8415e; --ok: #7be0a3; --warn: #e0a458; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding-bottom: 64px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font: 600 26px/1.2 Georgia, serif; }
  .who { font-size: 13px; color: var(--ink-3); }
  .who button { font: inherit; color: var(--ink-2); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  #lead { color: var(--ink-2); margin: 6px 0 8px; }
  .panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 20px; }
  label { display: block; font: 600 12.5px/1.3 inherit; color: var(--ink-2); margin: 12px 0 5px; }
  input, select, textarea { width: 100%; font: 400 16px/1.4 inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color-scheme: dark; }
  textarea { min-height: 72px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .btn { font: 600 15px/1 inherit; border-radius: 999px; padding: 14px 20px; cursor: pointer; border: 1.5px solid var(--line); background: none; color: var(--ink); }
  .btn.go { background: var(--ok); border-color: var(--ok); color: #0b100e; }
  .btn.no { border-color: var(--rose); color: var(--rose); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .tag { display: inline-block; font: 600 11.5px/1 inherit; letter-spacing: .08em; border-radius: 999px; padding: 6px 10px; border: 1px solid var(--line); color: var(--ink-2); }
  .tag.held { color: var(--warn); border-color: rgba(224,164,88,.5); }
  .found { margin-top: 12px; border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; color: var(--ink-2); font-size: 14.5px; }
  .found b { color: var(--ink); }
  .found ul { margin: 6px 0 0 18px; }
  .sent { font-size: 13px; color: var(--ink-3); margin-top: 10px; overflow-wrap: anywhere; }
  .sent a { color: var(--ink-2); }
  .msg { font: 600 14px/1.5 inherit; margin-top: 12px; }
  .msg.err { color: var(--rose); } .msg.ok { color: var(--ok); }
  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--ink-2); margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Holds</h1><div class="who" id="who"></div></header>
  <p id="lead">Loading…</p>
  <div id="signin" class="panel" hidden>
    <label for="email">Your email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
    <div class="row"><button class="btn go" id="send">Email me a sign-in link</button></div>
    <div class="msg" id="signmsg"></div>
  </div>
  <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const $ = id => document.getElementById(id);
const CATS = ["pleasure", "development", "networking", "family", "kids"];
const live = typeof SUPABASE_URL === "string" && SUPABASE_URL && typeof SUPABASE_ANON_KEY === "string" && SUPABASE_ANON_KEY;
let sb = null, rows = [];

/* the listing a held submission would publish: the moderator's cleaned-up version if it made one, else what was sent */
function draftOf(r) {
  const p = r.payload || {}, n = (r.moderation && r.moderation.normalized) || {};
  return {
    name: n.name ?? p.name ?? "", starts_on: n.starts_on ?? p.date ?? "", ends_on: n.ends_on ?? p.end_date ?? "",
    time_text: n.time_text ?? p.time ?? "", venue_text: n.venue_text ?? p.venue ?? "", town: n.town ?? (p.town === "other" ? "" : p.town) ?? "",
    cost: n.cost ?? p.cost ?? "", url: n.url ?? p.url ?? "", description: n.description ?? p.description ?? "",
    categories: n.categories ?? p.categories ?? [], distance_miles: n.distance_miles ?? ""
  };
}
function card(r) {
  const d = draftOf(r), m = r.moderation || {}, p = r.payload || {};
  const f = (k, label, type = "text", cls = "") => `<div class="${cls}"><label>${label}</label><input type="${type}" data-k="${k}" value="${esc(d[k])}"></div>`;
  return `<article class="card" data-id="${esc(r.id)}">
    <span class="tag ${r.status === "held" ? "held" : ""}">${r.status === "held" ? "HELD BY THE MODERATOR" : "NEW, NOT CHECKED YET"}</span>
    ${m.reasons || m.recommendation ? `<div class="found"><b>What the moderator found</b>${m.recommendation ? `<div>Recommends: ${esc(m.recommendation)}</div>` : ""}
      ${(m.reasons || []).length ? `<ul>${m.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>` : ""}
    <div class="grid">
      ${f("name", "Event name", "text", "full")}
      ${f("starts_on", "Date", "date")}${f("ends_on", "Last day", "date")}
      ${f("time_text", "Time")}
      <div><label>Cost</label><select data-k="cost">${["free", "$", "$$", "$$$"].map(c => `<option ${d.cost === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      ${f("venue_text", "Venue")}${f("town", "Town")}
      ${f("url", "Official link", "url", "full")}
      <div class="full"><label>Lanes</label><input data-k="categories" value="${esc((d.categories || []).join(", "))}" placeholder="pleasure, family"></div>
      <div class="full"><label>Description</label><textarea data-k="description">${esc(d.description)}</textarea></div>
      <div class="full"><label>If rejecting, why <span style="font-weight:400;color:var(--ink-3)">optional</span></label><input data-k="_reason"></div>
    </div>
    <div class="sent">Sent ${esc((r.created_at || "").slice(0, 16).replace("T", " "))} by ${esc(r.submitter_email || "")}${p.newsletter ? " · wants the Friday Radar" : ""}
      · link as sent: ${/^https?:\/\//.test(p.url || "") ? `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>` : esc(p.url || "none")}</div>
    <div class="row"><button class="btn go" data-act="publish">Publish as shown</button><button class="btn no" data-act="reject">Reject</button></div>
    <div class="msg"></div>
  </article>`;
}
async function load() {
  const { data, error } = await sb.from("submissions").select("*").in("status", ["held", "new"]).order("created_at", { ascending: true });
  if (error) { $("lead").textContent = "Could not load: " + error.message; return; }
  rows = data || [];
  const held = rows.filter(r => r.status === "held").length;
  $("lead").textContent = rows.length ? `${held} held for you, ${rows.length - held} new and not checked yet. Fields are editable: what you see is what gets published.`
    : "Nothing is waiting.";
  $("list").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">No holds. The moderator runs once a day.</div>`;
}
$("list").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const el = b.closest(".card"), id = el.dataset.id, msg = el.querySelector(".msg");
  const get = k => (el.querySelector(`[data-k="${k}"]`).value || "").trim();
  el.querySelectorAll("button").forEach(x => x.disabled = true); msg.className = "msg"; msg.textContent = "Working…";
  let args;
  if (b.dataset.act === "publish") {
    const cats = get("categories").split(",").map(x => x.trim().toLowerCase()).filter(x => CATS.includes(x));
    if (!cats.length) { msg.className = "msg err"; msg.textContent = "Add at least one lane: " + CATS.join(", "); el.querySelectorAll("button").forEach(x => x.disabled = false); return; }
    args = { sub: id, decision: "publish", reason: null, listing: { name: get("name"), starts_on: get("starts_on"), ends_on: get("ends_on"), time_text: get("time_text"),
      venue_text: get("venue_text"), town: get("town"), cost: get("cost"), url: get("url"), description: get("description"), categories: cats } };
  } else {
    args = { sub: id, decision: "reject", listing: null, reason: get("_reason") || null };
  }
  const { error } = await sb.rpc("decide_submission", args);
  if (error) { msg.className = "msg err"; msg.textContent = error.message; el.querySelectorAll("button").forEach(x => x.disabled = false); return; }
  msg.className = "msg ok"; msg.textContent = b.dataset.act === "publish" ? "Published. It is on the radar now." : "Rejected.";
  setTimeout(load, 900);
});
async function start() {
  if (!live || !window.supabase) { $("lead").textContent = "The Holds page needs the database connection (config.js)."; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s) => { if (s && !rows.length && $("signin").hidden === false) location.reload(); });
  if (!session) {
    $("lead").textContent = "Sign in to see what the moderator held.";
    $("signin").hidden = false;
    $("send").addEventListener("click", async () => {
      const email = $("email").value.trim(), m = $("signmsg");
      if (!/^\S+@\S+\.\S+$/.test(email)) { m.className = "msg err"; m.textContent = "Enter your email."; return; }
      $("send").disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      m.className = "msg " + (error ? "err" : "ok");
      m.textContent = error ? error.message : "Check your email for the sign-in link, then come back to this page.";
      $("send").disabled = false;
    });
    return;
  }
  $("who").innerHTML = `${esc(session.user.email)} · <button id="out">sign out</button>`;
  $("out").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
  await load();
  if (!rows.length && $("lead").textContent.startsWith("Could not")) return;
}
start();
</script>
</body>
</html>
